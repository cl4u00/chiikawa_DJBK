{% extends 'base.html' %}

{% block titulo %}Tienda · Cocina con Hachiware{% endblock %}

{% block contenido %}
<section class="recuadro" aria-labelledby="tienda">
    <h2 id="tienda">Tienda</h2>
    <div class="grid-productos">
        {% for producto in productos %}
            {% include 'includes/producto.html' %}
        {% empty %}
            <p class="vacio">Aún no hay productos en la tienda.</p>
        {% endfor %}
    </div>
    <p class="acciones"><a class="btn-chiikawa" href="{% url 'crear_producto' %}">Añadir producto</a></p>
</section>
{% endblock %}
